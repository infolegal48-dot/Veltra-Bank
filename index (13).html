function calcAge(dobStr) {
  if (!dobStr) return 0;
  const dob = new Date(dobStr);
  const now = new Date();
  let age = now.getFullYear() - dob.getFullYear();
  const m = now.getMonth() - dob.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < dob.getDate())) age--;
  return age;
}

function passwordScore(pw = "") {
  let score = 0;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[a-z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  return score; // 0-5
}
function passwordLabel(score) {
  if (score <= 1) return { label: "Very weak", color: "bg-rose-500", text: "text-rose-600" };
  if (score === 2) return { label: "Weak", color: "bg-orange-500", text: "text-orange-600" };
  if (score === 3) return { label: "Fair", color: "bg-amber-500", text: "text-amber-600" };
  if (score === 4) return { label: "Strong", color: "bg-emerald-500", text: "text-emerald-600" };
  return { label: "Excellent", color: "bg-emerald-600", text: "text-emerald-700" };
}

function download(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

const cx = (...c) => c.filter(Boolean).join(" ");

function Btn({ children, variant = "primary", size = "md", className = "", icon: Icon, iconRight, ...props }) {
  const sizes = { sm: "px-3 py-1.5 text-sm", md: "px-5 py-2.5 text-sm", lg: "px-7 py-3.5 text-base" };
  const variants = {
    primary: "bg-teal-600 text-white hover:bg-teal-700 shadow-sm",
    dark: "bg-slate-900 text-white hover:bg-slate-800 shadow-sm",
    outline: "border border-slate-300 text-slate-800 hover:bg-slate-50",
    outlineLight: "border border-white/40 text-white hover:bg-white/10",
    ghost: "text-slate-700 hover:bg-slate-100",
    danger: "bg-rose-600 text-white hover:bg-rose-700",
    subtle: "bg-teal-50 text-teal-700 hover:bg-teal-100",
  };
  return (
    <button
      className={cx(
        "inline-flex items-center justify-center gap-2 rounded-lg font-semibold transition-colors disabled:opacity-50 disabled:cursor-not-allowed",
        sizes[size], variants[variant], className
      )}
      {...props}
    >
      {Icon && !iconRight && <Icon size={16} />}
      {children}
      {Icon && iconRight && <Icon size={16} />}
    </button>
  );
}

/* ============================== FLOATING SUPPORT CHAT ============================== */
function SupportChat({ open, onClose }) {
  const [messages, setMessages] = useState([
    { from: "bot", text: "Hi, I'm Vela, Veltra Bank's support assistant. This is a simulated chat for demo purposes — how can I help?" },
  ]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const endRef = useRef(null);

  useEffect(() => {
    endRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, typing]);

  function send() {
    if (!input.trim()) return;
    const userMsg = { from: "user", text: input.trim() };
    setMessages((m) => [...m, userMsg]);
    setInput("");
    setTyping(true);
    setTimeout(() => {
      const replies = [
        "Thanks for the details — in a live environment this would route to a specialist. Is there anything else I can note on your case?",
        "Got it. For account-specific issues, our team typically responds within one business day.",
        "I've logged that for you. You can also reach us at support@veltrabank.example or call 1-800-555-0130.",
      ];
      setTyping(false);
      setMessages((m) => [...m, { from: "bot", text: replies[Math.floor(Math.random() * replies.length)] }]);
    }, 900);
  }

  if (!open) return null;
  return (
    <div className="fixed bottom-5 right-5 z-[150] flex h-[28rem] w-80 flex-col overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl fade-up sm:w-96">
      <div className="flex items-center justify-between bg-slate-900 px-4 py-3 text-white">
        <div className="flex items-center gap-2">
          <MessageCircle size={18} className="text-teal-400" />
          <div>
            <p className="text-sm font-semibold">Veltra Support</p>
            <p className="text-[11px] text-slate-300">Typically replies in a few minutes</p>
          </div>
        </div>
        <button onClick={onClose} className="rounded-full p-1 hover:bg-white/10"><X size={16} /></button>
      </div>
      <div className="flex-1 space-y-3 overflow-y-auto bg-slate-50 p-3">
        {messages.map((m, i) => (
          <div key={i} className={cx("flex", m.from === "user" ? "justify-end" : "justify-start")}>
            <div className={cx("max-w-[85%] rounded-2xl px-3 py-2 text-sm", m.from === "user" ? "bg-teal-600 text-white" : "bg-white border border-slate-200 text-slate-700")}>
              {m.text}
            </div>
          </div>
        ))}
        {typing && <div className="text-xs text-slate-400 pulse-dot">Vela is typing…</div>}
        <div ref={endRef} />
      </div>
      <div className="flex gap-2 border-t border-slate-200 p-2">
        <input
          value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && send()}
          placeholder="Type a message…"
          className="flex-1 rounded-lg border border-slate-300 px-3 py-2 text-sm"
        />
        <Btn size="sm" onClick={send}>Send</Btn>
      </div>
    </div>
  );
}

function LoanCalcModal({ open, name, onClose, requireAuth }) {
  const [amount, setAmount] = useState(10000);
  const [income, setIncome] = useState(4000);
  const [months, setMonths] = useState(36);
  const rate = 0.109;
  const monthly = useMemo(() => {
    const r = rate / 12;
    return (amount * r) / (1 - Math.pow(1 + r, -months));
  }, [amount, months]);
  const affordable = monthly <= income * 0.4;
  return (
    <Modal open={open} onClose={onClose} title={`${name || "Loan"} pre-qualification`}>
      <div className="space-y-5">
        <Field label={`Loan amount — ${fmt(amount)}`}>
          <input type="range" min="1000" max="35000" step="500" value={amount} onChange={(e) => setAmount(+e.target.value)} className="w-full accent-teal-600" />
        </Field>
        <Field label={`Term — ${months} months`}>
          <input type="range" min="12" max="72" step="6" value={months} onChange={(e) => setMonths(+e.target.value)} className="w-full accent-teal-600" />
        </Field>
        <Field label="Monthly income (before tax)">
          <TextInput type="number" value={income} onChange={(e) => setIncome(+e.target.value)} />
        </Field>
        <div className="rounded-xl bg-slate-50 p-4">
          <p className="text-xs text-slate-500">Estimated monthly payment at {(rate * 100).toFixed(1)}% APR</p>
          <p className="f-mono text-2xl font-semibold text-slate-900">{fmt(monthly)}</p>
          <p className={cx("mt-2 text-xs font-semibold", affordable ? "text-emerald-600" : "text-rose-600")}>
            {affordable ? "You're likely to pre-qualify based on this estimate." : "This payment is high relative to your income — try a smaller amount or longer term."}
          </p>
        </div>
        <Btn className="w-full" onClick={() => { onClose(); requireAuth("loans"); }}>Continue application</Btn>
        <p className="text-center text-xs text-slate-400">This is a non-binding, illustrative estimate only.</p>
      </div>
    </Modal>
  );
}

  const [form, setForm] = useState({ name: "", email: "", subject: "General question", message: "" });
  const [errors, setErrors] = useState({});

  function submit(e) {
    e.preventDefault();
    const errs = {};
    if (!form.name.trim()) errs.name = "Enter your name.";
    if (!emailRe.test(form.email)) errs.email = "Enter a valid email address.";
    if (form.message.trim().length < 10) errs.message = "Add a few more details (min 10 characters).";

/* ============================== LOGIN PAGE ============================== */
function LoginPage({ goto, users, onSuccess, prefillEmail, pushToast }) {
  const [email, setEmail] = useState(prefillEmail || "");
  const [password, setPassword] = useState("");
  const [showPw, setShowPw] = useState(false);
  const [errors, setErrors] = useState({});
  const [stage, setStage] = useState("credentials"); // credentials -> mfa
  const [attempts, setAttempts] = useState(0);
  const [lockUntil, setLockUntil] = useState(0);
  const [now, setNow] = useState(Date.now());
  const [matchedUser, setMatchedUser] = useState(null);
  const [code, setCode] = useState(["", "", "", "", "", ""]);
  const [resendCooldown, setResendCooldown] = useState(0);
  const [forgot, setForgot] = useState(false);
  const [forgotSent, setForgotSent] = useState(false);
  const codeRefs = useRef([]);

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  useEffect(() => {
    if (resendCooldown <= 0) return;
    const t = setTimeout(() => setResendCooldown((s) => s - 1), 1000);
    return () => clearTimeout(t);
  }, [resendCooldown]);

  const locked = now < lockUntil;
  const lockSecs = Math.max(0, Math.ceil((lockUntil - now) / 1000));

  function submitCreds(e) {
    e.preventDefault();
    if (locked) return;
    const errs = {};
    if (!emailRe.test(email)) errs.email = "Enter a valid email address.";
    if (!password) errs.password = "Enter your password.";
    setErrors(errs);
    if (Object.keys(errs).length) return;

    const user = users.find((u) => u.email.toLowerCase() === email.toLowerCase());
    if (!user || user.password !== password) {
      const next = attempts + 1;
      setAttempts(next);
      if (next >= 3) {
        setLockUntil(Date.now() + 30000);
        setErrors({ form: "Too many failed attempts. Try again in 30 seconds." });
      } else {
        setErrors({ form: `Incorrect email or password. ${3 - next} attempt(s) remaining.` });
      }
      return;
    }
    setAttempts(0);
    setMatchedUser(user);
    if (user.mfaEnabled) {
      setStage("mfa");
      setResendCooldown(30);
    } else {
      onSuccess(user);
    }
  }

  function submitCode() {
    const val = code.join("");
    if (val.length < 6) {
      setErrors({ mfa: "Enter the 6-digit code." });
      return;
    }
    if (val !== "123456") {
      setErrors({ mfa: "Incorrect code. Use 123456 for this demo." });
      return;
    }
    onSuccess(matchedUser);
  }

  function submitForgot(e) {
    e.preventDefault();
    if (!emailRe.test(email)) { setErrors({ email: "Enter a valid email address to reset your password." }); return; }
    setForgotSent(true);
    pushToast("If that email exists, a reset link has been sent (demo).");
  }

  return (
    <div className="grid min-h-[calc(100vh-45px)] lg:grid-cols-2">
      <div className="hidden flex-col justify-between bg-slate-950 p-10 text-white lg:flex">
        <button onClick={() => goto("home")}><Logo dark /></button>
        <div>
          <h2 className="f-display max-w-sm text-3xl font-bold leading-snug">Welcome back. Your full ledger is one sign-in away.</h2>
          <div className="ledger-rule dark my-6" />
          <p className="max-w-sm text-sm text-slate-400">Every sign-in is protected with two-factor verification and logged to your security activity.</p>
        </div>
        <p className="text-xs text-slate-500">© 2026 Veltra Bank (demo)</p>
      </div>

      <div className="flex items-center justify-center p-6 sm:p-10">
        <div className="w-full max-w-sm">
          <button onClick={() => goto("home")} className="mb-6 flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800 lg:hidden">
            <ArrowLeft size={15} /> Back home
          </button>

          {stage === "credentials" && !forgot && (
            <>
              <h1 className="f-display text-2xl font-bold text-slate-900">Log in to Veltra Bank</h1>
              <p className="mt-1 text-sm text-slate-500">Enter your details to access your dashboard.</p>

              <form onSubmit={submitCreds} className="mt-5 space-y-4">
                <Field label="Email" required error={errors.email}>
                  <TextInput type="email" value={email} onChange={(e) => setEmail(e.target.value)} error={errors.email} placeholder="you@example.com" disabled={locked} />
                </Field>
                <Field label="Password" required error={errors.password}>
                  <div className="relative">
                    <TextInput type={showPw ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} error={errors.password} placeholder="••••••••" disabled={locked} />
                    <button type="button" onClick={() => setShowPw((s) => !s)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">
                      {showPw ? <EyeOff size={16} /> : <Eye size={16} />}
                    </button>
                  </div>
                </Field>
                <div className="flex items-center justify-between text-sm">
                  <label className="flex items-center gap-2 text-slate-600"><input type="checkbox" className="accent-teal-600" /> Remember me</label>
                  <button type="button" onClick={() => setForgot(true)} className="font-semibold text-teal-700">Forgot password?</button>
                </div>
                {errors.form && <p className="flex items-center gap-1.5 text-sm font-medium text-rose-600"><AlertCircle size={14} /> {errors.form}</p>}
                {locked && <p className="text-sm font-medium text-rose-600">Locked — try again in {lockSecs}s.</p>}
                <Btn type="submit" className="w-full" disabled={locked}>Log in</Btn>
              </form>
              <p className="mt-6 text-center text-sm text-slate-500">
                New to Veltra? <button onClick={() => goto("register")} className="font-semibold text-teal-700">Create an account</button>
              </p>
            </>
          )}

          {stage === "credentials" && forgot && (
            <>
              <button onClick={() => { setForgot(false); setForgotSent(false); }} className="mb-4 flex items-center gap-1.5 text-sm font-semibold text-slate-500"><ArrowLeft size={15} /> Back to log in</button>
              <h1 className="f-display text-2xl font-bold text-slate-900">Reset your password</h1>
              <p className="mt-1 text-sm text-slate-500">We'll send a reset link to your email.</p>
              {!forgotSent ? (
                <form onSubmit={submitForgot} className="mt-5 space-y-4">
                  <Field label="Email" required error={errors.email}>
                    <TextInput type="email" value={email} onChange={(e) => setEmail(e.target.value)} error={errors.email} placeholder="you@example.com" />
                  </Field>
                  <Btn type="submit" className="w-full">Send reset link</Btn>
                </form>
              ) : (
                <div className="mt-5 rounded-xl bg-emerald-50 p-4 text-sm text-emerald-800">
                  <CheckCircle2 className="mb-2" size={18} />
                  If an account exists for {email}, a reset link has been sent. (Demo — no email is actually sent.)
                </div>
              )}
            </>
          )}

          {stage === "mfa" && (
            <>
              <button onClick={() => setStage("credentials")} className="mb-4 flex items-center gap-1.5 text-sm font-semibold text-slate-500"><ArrowLeft size={15} /> Back</button>
              <h1 className="f-display text-2xl font-bold text-slate-900">Verify it's you</h1>
              <p className="mt-1 text-sm text-slate-500">Enter the 6-digit code sent to your registered phone.</p>
              <div className="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800">
                Demo mode: use code <span className="f-mono font-semibold">123456</span>.
              </div>
              <div className="mt-5 flex gap-2">
                {code.map((c, i) => (
                  <input
                    key={i}
                    ref={(el) => (codeRefs.current[i] = el)}
                    value={c}
                    maxLength={1}
                    inputMode="numeric"
                    onChange={(e) => {
                      const v = e.target.value.replace(/\D/g, "");
                      const next = [...code]; next[i] = v; setCode(next);
                      if (v && codeRefs.current[i + 1]) codeRefs.current[i + 1].focus();
                    }}
                    onKeyDown={(e) => { if (e.key === "Backspace" && !code[i] && codeRefs.current[i - 1]) codeRefs.current[i - 1].focus(); }}
                    className="h-12 w-11 rounded-lg border border-slate-300 text-center text-lg font-semibold focus:border-teal-600"
                  />
                ))}
              </div>
              {errors.mfa && <p className="mt-2 flex items-center gap-1.5 text-sm font-medium text-rose-600"><AlertCircle size={14} /> {errors.mfa}</p>}
              <Btn className="mt-5 w-full" onClick={submitCode}>Verify &amp; continue</Btn>
              <button
                disabled={resendCooldown > 0}
                onClick={() => setResendCooldown(30)}
                className="mt-4 w-full text-center text-sm font-semibold text-teal-700 disabled:text-slate-400"
              >
                {resendCooldown > 0 ? `Resend code in ${resendCooldown}s` : "Resend code"}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============================== REGISTER PAGE ============================== */
const REG_STEPS = ["Personal details", "Contact & address", "Identity & employment", "Account setup", "Verify identity", "Review & submit"];

function RegisterPage({ goto, users, setUsers, pushToast }) {
  const [step, setStep] = useState(0);
  const [done, setDone] = useState(false);
  const [refNo, setRefNo] = useState("");
  const [errors, setErrors] = useState({});
  const [verifying, setVerifying] = useState(false);
  const [verified, setVerified] = useState(false);
  const [idFile, setIdFile] = useState("");
  const [proofFile, setProofFile] = useState("");

  const [f, setF] = useState({
    firstName: "", lastName: "", dob: "", gender: "Prefer not to say", nationality: "",
    address: "", city: "", country: "", postalCode: "", phone: "", email: "",
    idType: "Passport", idNumber: "", occupation: "", employer: "", income: "$2,000–$4,000",
    sourceOfFunds: "Salary/employment", taxCountry: "", taxId: "",
    accountType: "Everyday Checking", password: "", confirmPassword: "",
    terms: false, privacy: false, econsent: false,
  });
  const set = (k, v) => setF((s) => ({ ...s, [k]: v }));

  function validateStep(i) {
    const e = {};
    if (i === 0) {
      if (!f.firstName.trim()) e.firstName = "Required.";
      if (!f.lastName.trim()) e.lastName = "Required.";
      if (!f.dob) e.dob = "Required.";
      else if (calcAge(f.dob) < 18) e.dob = "You must be at least 18 years old.";
      if (!f.nationality.trim()) e.nationality = "Required.";
    }
    if (i === 1) {
      if (!f.address.trim()) e.address = "Required.";
      if (!f.city.trim()) e.city = "Required.";
      if (!f.country.trim()) e.country = "Required.";
      if (!f.postalCode.trim()) e.postalCode = "Required.";
      if (!phoneRe.test(f.phone)) e.phone = "Enter a valid phone number.";
      if (!emailRe.test(f.email)) e.email = "Enter a valid email address.";
      else if (users.some((u) => u.email.toLowerCase() === f.email.toLowerCase())) e.email = "An account with this email already exists.";
    }
    if (i === 2) {
      if (!f.idNumber.trim()) e.idNumber = "Required.";
      if (!f.occupation.trim()) e.occupation = "Required.";
      if (f.occupation.toLowerCase() !== "unemployed" && f.occupation.toLowerCase() !== "student" && !f.employer.trim()) e.employer = "Required for your employment status.";
      if (!f.taxCountry.trim()) e.taxCountry = "Required.";
    }
    if (i === 3) {
      const ps = passwordScore(f.password);
      if (ps < 3) e.password = "Choose a stronger password (8+ chars, upper, lower, number).";
      if (f.password !== f.confirmPassword) e.confirmPassword = "Passwords do not match.";
    }
    if (i === 4) {
      if (!verified) e.verify = "Please complete identity verification before continuing.";
    }
    if (i === 5) {
      if (!f.terms || !f.privacy || !f.econsent) e.terms = "You must accept all agreements to continue.";
    }
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function next() {
    if (!validateStep(step)) return;
    if (step === REG_STEPS.length - 1) return submit();
    setStep((s) => s + 1);
  }
  function back() { setErrors({}); setStep((s) => Math.max(0, s - 1)); }

  function runVerification() {
    if (!idFile || !proofFile) { setErrors({ verify: "Upload both documents to continue." }); return; }
    setVerifying(true);
    setTimeout(() => { setVerifying(false); setVerified(true); }, 1800);
  }

  function submit() {
    const rn = refNumber();
    setRefNo(rn);
    const newUser = {
      id: uid("usr"), email: f.email, password: f.password, firstName: f.firstName, lastName: f.lastName,
      phone: f.phone, address: `${f.address}, ${f.city}, ${f.country} ${f.postalCode}`, occupation: f.occupation,
      accountType: f.accountType, mfaEnabled: false, isDemo: false, kycVerifiedAt: new Date().toISOString(),
      idType: f.idType, idNumber: f.idNumber,
    };
    setUsers((u) => [...u, newUser]);
    setDone(true);
    pushToast("Application submitted — account approved (demo).");
  }

  if (done) {
    return (
      <div className="flex min-h-[calc(100vh-45px)] items-center justify-center px-4 py-16">
        <div className="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center shadow-sm fade-up">
          <div className="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-emerald-100 text-emerald-600"><CheckCircle2 size={28} /></div>
          <h1 className="f-display text-2xl font-bold text-slate-900">Application approved</h1>
          <p className="mt-2 text-sm text-slate-600">Welcome, {f.firstName}. Your Veltra Bank account has been created and auto-approved for this demo.</p>
          <div className="mt-4 rounded-xl bg-slate-50 p-4 text-left text-sm">
            <p className="text-slate-500">Reference number</p>
            <p className="f-mono font-semibold text-slate-900">{refNo}</p>
            <p className="mt-2 text-slate-500">Account type</p>
            <p className="font-semibold text-slate-900">{f.accountType}</p>
          </div>
          <Btn className="mt-6 w-full" onClick={() => goto("login", null, f.email)}>Continue to log in</Btn>
        </div>
      </div>
    );
  }

  return (
    <div className="mx-auto max-w-2xl px-4 py-10 sm:px-6">
      <button onClick={() => goto("home")} className="mb-6 flex items-center gap-1.5 text-sm font-semibold text-slate-500 hover:text-slate-800"><ArrowLeft size={15} /> Back home</button>
      <h1 className="f-display text-2xl font-bold text-slate-900">Open an account</h1>
      <p className="mt-1 mb-6 text-sm text-slate-500">Takes about five minutes. You can review everything before it's submitted.</p>
      <ProgressSteps steps={REG_STEPS} current={step} />

      <div className="rounded-2xl border border-slate-200 bg-white p-6 sm:p-8">
        {step === 0 && (
          <div className="space-y-4">
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="First name" required error={errors.firstName}><TextInput value={f.firstName} onChange={(e) => set("firstName", e.target.value)} error={errors.firstName} /></Field>
              <Field label="Last name" required error={errors.lastName}><TextInput value={f.lastName} onChange={(e) => set("lastName", e.target.value)} error={errors.lastName} /></Field>
            </div>
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Date of birth" required error={errors.dob} hint="You must be 18 or older."><TextInput type="date" value={f.dob} onChange={(e) => set("dob", e.target.value)} error={errors.dob} /></Field>
              <Field label="Gender (optional)">
                <Select value={f.gender} onChange={(e) => set("gender", e.target.value)}>
                  <option>Prefer not to say</option><option>Female</option><option>Male</option><option>Non-binary</option>
                </Select>
              </Field>
            </div>
            <Field label="Nationality" required error={errors.nationality}><TextInput value={f.nationality} onChange={(e) => set("nationality", e.target.value)} error={errors.nationality} placeholder="e.g. Ghanaian" /></Field>
          </div>
        )}

        {step === 1 && (
          <div className="space-y-4">
            <Field label="Residential address" required error={errors.address}><TextInput value={f.address} onChange={(e) => set("address", e.target.value)} error={errors.address} placeholder="Street address" /></Field>
            <div className="grid gap-4 sm:grid-cols-3">
              <Field label="City" required error={errors.city}><TextInput value={f.city} onChange={(e) => set("city", e.target.value)} error={errors.city} /></Field>
              <Field label="Country" required error={errors.country}><TextInput value={f.country} onChange={(e) => set("country", e.target.value)} error={errors.country} /></Field>
              <Field label="Postal code" required error={errors.postalCode}><TextInput value={f.postalCode} onChange={(e) => set("postalCode", e.target.value)} error={errors.postalCode} /></Field>
            </div>
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Phone number" required error={errors.phone}><TextInput value={f.phone} onChange={(e) => set("phone", e.target.value)} error={errors.phone} placeholder="+233 20 000 0000" /></Field>
              <Field label="Email address" required error={errors.email}><TextInput type="email" value={f.email} onChange={(e) => set("email", e.target.value)} error={errors.email} placeholder="you@example.com" /></Field>
            </div>
          </div>
        )}

        {step === 2 && (
          <div className="space-y-4">
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="ID type" required>
                <Select value={f.idType} onChange={(e) => set("idType", e.target.value)}>
                  <option>Passport</option><option>National ID</option><option>Driver's licence</option>

              </Field>
              <Field label="ID number" required error={errors.idNumber}><TextInput value={f.idNumber} onChange={(e) => set("idNumber", e.target.value)} error={errors.idNumber} /></Field>

            <div className="grid gap-4 sm:grid-cols-2">

                <Select value={f.occupation} onChange={(e) => set("occupation", e.target.value)}>
                  <option value="">Select…</option>

            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Monthly income">
                <Select value={f.income} onChange={(e) => set("income", e.target.value)}>
                  <option>Under $2,000</option><option>$2,000–$4,000</option><option>$4,000–$8,000</option><option>Over $8,000</option>
                </Select>
              </Field>
              <Field label="Primary source of funds">
                <Select value={f.sourceOfFunds} onChange={(e) => set("sourceOfFunds", e.target.value)}>
                  <option>Salary/employment</option><option>Business income</option><option>Investments</option><option>Savings</option><option>Other</option>
                </Select>
              </Field>
            </div>
            <div className="grid gap-4 sm:grid-cols-2">
              <Field label="Country of tax residence" required error={errors.taxCountry}><TextInput value={f.taxCountry} onChange={(e) => set("taxCountry", e.target.value)} error={errors.taxCountry} /></Field>
              <Field label="Tax ID (optional)"><TextInput value={f.taxId} onChange={(e) => set("taxId", e.target.value)} /></Field>
            </div>
          </div>
        )}

        {step === 3 && (
          <div className="space-y-4">
            <Field label="Account type" required>
              <Select value={f.accountType} onChange={(e) => set("accountType", e.target.value)}>
                <option>Everyday Checking</option><option>Growth Savings</option><option>Premium Checking</option>
              </Select>
            </Field>
            <Field label="Password" required error={errors.password}>
              <TextInput type="password" value={f.password} onChange={(e) => set("password", e.target.value)} error={errors.password} />
            </Field>
            {f.password && (() => { const s = passwordScore(f.password); const l = passwordLabel(s); return (
              <div>
                <div className="flex h-1.5 gap-1">
                  {[0, 1, 2, 3, 4].map((i) => <div key={i} className={cx("flex-1 rounded-full", i < s ? l.color : "bg-slate-200")} />)}
                </div>
                <p className={cx("mt-1 text-xs font-semibold", l.text)}>{l.label}</p>
              </div>
            ); })()}
            <Field label="Confirm password" required error={errors.confirmPassword}>
              <TextInput type="password" value={f.confirmPassword} onChange={(e) => set("confirmPassword", e.target.value)} error={errors.confirmPassword} />
            </Field>
            <p className="text-xs text-slate-500">Use 8+ characters with a mix of upper and lower case letters, numbers, and a symbol.</p>
          </div>
        )}

        {step === 4 && (
          <div className="space-y-5">
            <p className="text-sm text-slate-600">To comply with identity verification (KYC) requirements, upload a photo of your ID and a proof of address.</p>
            <div className="grid gap-4 sm:grid-cols-2">
              <label className="flex cursor-pointer flex-col items-center gap-2 rounded-xl border-2 border-dashed border-slate-300 p-6 text-center hover:border-teal-400">
                <Upload className="text-slate-400" size={22} />
                <span className="text-sm font-semibold text-slate-700">{idFile || "Upload ID document"}</span>
                <span className="text-xs text-slate-400">JPG, PNG, or PDF</span>
                <input type="file" className="hidden" onChange={(e) => setIdFile(e.target.files?.[0]?.name || "")} />
              </label>
              <label className="flex cursor-pointer flex-col items-center gap-2 rounded-xl border-2 border-dashed border-slate-300 p-6 text-center hover:border-teal-400">
                <Upload className="text-slate-400" size={22} />
                <span className="text-sm font-semibold text-slate-700">{proofFile || "Upload proof of address"}</span>
                <span className="text-xs text-slate-400">Utility bill or bank statement</span>
                <input type="file" className="hidden" onChange={(e) => setProofFile(e.target.files?.[0]?.name || "")} />
              </label>
            </div>
            {!verified ? (
              <Btn onClick={runVerification} disabled={verifying} icon={verifying ? Loader2 : FileCheck2} className={verifying ? "animate-pulse" : ""}>
                {verifying ? "Verifying documents…" : "Run identity verification"}
              </Btn>
            ) : (
              <div className="flex items-center gap-2 rounded-xl bg-emerald-50 px-4 py-3 text-sm font-semibold text-emerald-700"><CheckCircle2 size={18} /> Identity verified</div>
            )}
            {errors.verify && <p className="flex items-center gap-1.5 text-sm font-medium text-rose-600"><AlertCircle size={14} /> {errors.verify}</p>}
          </div>
        )}

        {step === 5 && (
          <div className="space-y-5">
            <div className="grid grid-cols-2 gap-x-6 gap-y-2 rounded-xl bg-slate-50 p-4 text-sm">
              <p className="text-slate-500">Name</p><p className="font-medium text-slate-900">{f.firstName} {f.lastName}</p>
              <p className="text-slate-500">Email</p><p className="font-medium text-slate-900">{f.email}</p>
              <p className="text-slate-500">Phone</p><p className="font-medium text-slate-900">{f.phone}</p>
              <p className="text-slate-500">Address</p><p className="font-medium text-slate-900">{f.city}, {f.country}</p>
              <p className="text-slate-500">ID</p><p className="font-medium text-slate-900">{f.idType} •••{f.idNumber.slice(-4)}</p>
              <p className="text-slate-500">Account type</p><p className="font-medium text-slate-900">{f.accountType}</p>
              <p className="text-slate-500">Identity verification</p><p className="font-medium text-emerald-600">Verified</p>
            </div>
            <div className="space-y-2 text-sm">
              <label className="flex items-start gap-2"><input type="checkbox" className="mt-0.5 accent-teal-600" checked={f.terms} onChange={(e) => set("terms", e.target.checked)} /> I accept the Terms and Conditions.</label>
              <label className="flex items-start gap-2"><input type="checkbox" className="mt-0.5 accent-teal-600" checked={f.privacy} onChange={(e) => set("privacy", e.target.checked)} /> I accept the Privacy Policy.</label>
              <label className="flex items-start gap-2"><input type="checkbox" className="mt-0.5 accent-teal-600" checked={f.econsent} onChange={(e) => set("econsent", e.target.checked)} /> I consent to electronic communications and statements.</label>
            </div>
            {errors.terms && <p className="flex items-center gap-1.5 text-sm font-medium text-rose-600"><AlertCircle size={14} /> {errors.terms}</p>}
          </div>
        )}

        <div className="mt-8 flex items-center justify-between">
          <Btn variant="ghost" onClick={back} disabled={step === 0} icon={ArrowLeft}>Back</Btn>
          <Btn onClick={next}>{step === REG_STEPS.length - 1 ? "Submit application" : "Continue"}</Btn>
        </div>
      </div>
    </div>
  );
}

/* ============================== DASHBOARD ============================== */

  { key: "beneficiaries", label: "Beneficiaries", icon: Users },
  { key: "cards", label: "Cards", icon: CreditCard },
  { key: "statements", label: "Statements", icon: FileText },
  { key: "profile", label: "Profile", icon: Settings },
  { key: "security", label: "Security", icon: ShieldCheck },

          {DASH_NAV.map((n) => (

              )}
            >
              <n.icon size={17} /> {n.label}
            </button>
          ))}
        </nav>
        <button onClick={onLogout} className="mt-4 flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold text-rose-600 hover:bg-rose-50">
          <LogOut size={17} /> Log out
        </button>
      </aside>

      {/* Mobile sidebar drawer */}
      {sidebarOpen && (
        <div className="fixed inset-0 z-50 lg:hidden">
          <div className="absolute inset-0 bg-slate-900/60" onClick={() => setSidebarOpen(false)} />
          <div className="absolute left-0 top-0 h-full w-72 bg-white p-4 fade-up">
            <div className="mb-6 flex items-center justify-between px-1">
              <Logo />
              <button onClick={() => setSidebarOpen(false)}><X size={20} /></button>
            </div>
            <nav className="space-y-1">
              {DASH_NAV.map((n) => (
                <button
                  key={n.key}
                  onClick={() => { setTab(n.key); setSidebarOpen(false); }}
                  className={cx("flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold", tab === n.key ? "bg-teal-50 text-teal-700" : "text-slate-600 hover:bg-slate-50")}
                >
                  <n.icon size={17} /> {n.label}
                </button>
              ))}
              <button onClick={onLogout} className="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-semibold text-rose-600 hover:bg-rose-50"><LogOut size={17} /> Log out</button>
            </nav>
          </div>
        </div>
      )}

      <div className="flex min-h-full flex-1 flex-col">
        {/* Topbar */}
        <header className="sticky top-0 z-30 flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3 sm:px-6">
          <div className="flex items-center gap-3">
            <button className="lg:hidden" onClick={() => setSidebarOpen(true)}><Menu size={20} /></button>
            <div className="hidden items-center gap-2 rounded-lg border border-slate-200 px-3 py-1.5 sm:flex">
              <Search size={15} className="text-slate-400" />
              <input placeholder="Search transactions, beneficiaries…" className="w-56 text-sm outline-none placeholder:text-slate-400" onKeyDown={(e) => { if (e.key === "Enter") setTab("transactions"); }} />
            </div>
          </div>
          <div className="flex items-center gap-2">
            <div className="relative">
              <button onClick={() => { setNotifOpen((o) => !o); setProfileMenu(false); }} className="relative rounded-full p-2 hover:bg-slate-100">
                <Bell size={19} />
                {unread > 0 && <span className="absolute right-1 top-1 h-2 w-2 rounded-full bg-rose-500" />}
              </button>
              {notifOpen && (
                <div className="absolute right-0 z-40 mt-2 w-80 rounded-xl border border-slate-200 bg-white p-2 shadow-xl fade-up">
                  <div className="flex items-center justify-between px-2 py-1.5">
                    <p className="text-sm font-semibold text-slate-900">Notifications</p>
                    <button onClick={markAllRead} className="text-xs font-semibold text-teal-700">Mark all read</button>
                  </div>
                  <div className="max-h-80 space-y-1 overflow-y-auto">
                    {session.notifications.map((n) => (
                      <div key={n.id} className={cx("rounded-lg px-2 py-2", !n.read && "bg-teal-50/60")}>
                        <p className="text-sm font-semibold text-slate-800">{n.title}</p>
                        <p className="text-xs text-slate-500">{n.body}</p>
                        <p className="mt-0.5 text-[11px] text-slate-400">{n.time}</p>

            <div className="relative">
              <button onClick={() => { setProfileMenu((o) => !o); setNotifOpen(false); }} className="flex items-center gap-2 rounded-full pl-1 pr-2 py-1 hover:bg-slate-100">

                <ChevronDown size={14} className="hidden sm:block text-slate-400" />

              {profileMenu && (
                <div className="absolute right-0 z-40 mt-2 w-52 rounded-xl border border-slate-200 bg-white p-1.5 shadow-xl fade-up">
                  <p className="px-2.5 py-2 text-sm font-semibold text-slate-800">{profile.firstName} {profile.lastName}</p>
                  <button onClick={() => { setTab("profile"); setProfileMenu(false); }} className="flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-sm text-slate-600 hover:bg-slate-50"><Settings size={15} /> My profile</button>
                  <button onClick={() => { setTab("security"); setProfileMenu(false); }} className="flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-sm text-slate-600 hover:bg-slate-50"><ShieldCheck size={15} /> Security</button>
                  <button onClick={onLogout} className="flex w-full items-center gap-2 rounded-lg px-2.5 py-2 text-sm text-rose-600 hover:bg-rose-50"><LogOut size={15} /> Log out</button>

        <main className="flex-1 p-4 sm:p-6">
          {tab === "overview" && <Overview profile={profile} session={session} greeting={greeting} setTab={setTab} />}
          {tab === "transactions" && <Transactions session={session} />}
          {tab === "transfers" && <Transfers session={session} setSession={setSession} pushToast={pushToast} />}
          {tab === "beneficiaries" && <Beneficiaries session={session} setSession={setSession} pushToast={pushToast} />}
          {tab === "cards" && <CardsTab session={session} setSession={setSession} pushToast={pushToast} />}

          {tab === "support" && <SupportTab session={session} setSession={setSession} pushToast={pushToast} openChat={openChat} />}

function Overview({ profile, session, greeting, setTab }) {
  const [txModal, setTxModal] = useState(null);
  const recent = session.transactions.slice(0, 5);
  const totalBalance = session.accounts.reduce((s, a) => s + (a.type === "Credit" ? 0 : a.current), 0);

  const byCat = {};
  session.transactions.forEach((t) => { if (t.amount < 0) byCat[t.category] = (byCat[t.category] || 0) + Math.abs(t.amount); });
  const catList = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maxCat = Math.max(1, ...catList.map((c) => c[1]));

  return (
    <div className="space-y-6">
      <div>
        <h1 className="f-display text-2xl font-bold text-slate-900">{greeting}, {profile.firstName}.</h1>
        <p className="text-sm text-slate-500">Here's where things stand across your accounts.</p>
      </div>

      <div className="rounded-2xl bg-slate-950 p-6 text-white">
        <p className="text-xs uppercase tracking-wide text-slate-400">Total balance across accounts</p>
        <p className="f-mono mt-1 text-3xl font-semibold">{fmt(totalBalance)}</p>
        <div className="mt-5 flex flex-wrap gap-2">
          <Btn size="sm" onClick={() => setTab("transfers")} icon={Send}>Send money</Btn>
          <Btn size="sm" variant="outlineLight" onClick={() => setTab("beneficiaries")} icon={Plus}>Add beneficiary</Btn>
          <Btn size="sm" variant="outlineLight" onClick={() => setTab("cards")} icon={Snowflake}>Manage cards</Btn>
        </div>
      </div>

      <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        {session.accounts.map((a) => (
          <div key={a.id} className="rounded-2xl border border-slate-200 bg-white p-5">
            <div className="flex items-center justify-between">
              <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-teal-50 text-teal-700"><AccountIcon type={a.type} size={17} /></div>
              <Badge tone={a.type === "Credit" ? "amber" : "slate"}>{a.type}</Badge>
            </div>
            <p className="mt-3 text-sm font-semibold text-slate-800">{a.name}</p>
            <p className="text-xs text-slate-400 f-mono">•••• {a.number}</p>
            <p className="f-mono mt-3 text-2xl font-semibold text-slate-900">{fmt(a.type === "Credit" ? a.available : a.available)}</p>
            <p className="text-xs text-slate-500">{a.type === "Credit" ? `Available credit of ${fmt(a.limit)} limit` : "Available balance"}</p>
          </div>
        ))}
      </div>

      <div className="grid gap-6 lg:grid-cols-5">
        <div className="rounded-2xl border border-slate-200 bg-white p-5 lg:col-span-3">
          <div className="mb-3 flex items-center justify-between">
            <h3 className="f-display font-semibold text-slate-900">Recent transactions</h3>
            <button onClick={() => setTab("transactions")} className="text-sm font-semibold text-teal-700">View all</button>
          </div>
          <div className="divide-y divide-slate-100">
            {recent.map((t) => (
              <button key={t.id} onClick={() => setTxModal(t)} className="flex w-full items-center justify-between py-2.5 text-left hover:bg-slate-50 px-1 rounded-lg">
                <div className="flex items-center gap-3">
                  <div className={cx("flex h-8 w-8 items-center justify-center rounded-full", t.amount > 0 ? "bg-emerald-50 text-emerald-600" : "bg-slate-100 text-slate-500")}>
                    {t.amount > 0 ? <ArrowDownLeft size={14} /> : <ArrowUpRight size={14} />}
                  </div>
                  <div>
                    <p className="text-sm font-medium text-slate-800">{t.description}</p>
                    <p className="text-xs text-slate-400">{fmtDate(t.date)} · {t.category}</p>
                  </div>
                </div>
                <p className={cx("f-mono text-sm font-semibold", t.amount > 0 ? "text-emerald-600" : "text-slate-800")}>{t.amount > 0 ? "+" : ""}{fmt(t.amount)}</p>
              </button>
            ))}
          </div>
        </div>
        <div className="rounded-2xl border border-slate-200 bg-white p-5 lg:col-span-2">
          <h3 className="f-display mb-4 font-semibold text-slate-900 flex items-center gap-2"><BarChart3 size={16} className="text-teal-600" /> Spending by category</h3>
          <div className="space-y-3">
            {catList.length === 0 && <p className="text-sm text-slate-400">No spending yet.</p>}
            {catList.map(([cat, val]) => (
              <div key={cat}>
                <div className="mb-1 flex justify-between text-xs font-medium text-slate-600"><span>{cat}</span><span className="f-mono">{fmt(val)}</span></div>
                <div className="h-2 rounded-full bg-slate-100"><div className="h-2 rounded-full bg-teal-600" style={{ width: `${(val / maxCat) * 100}%` }} /></div>
              </div>
            ))}
          </div>
        </div>
      </div>
      <TxDetailModal tx={txModal} onClose={() => setTxModal(null)} />
    </div>
  );
}

function TxDetailModal({ tx, onClose }) {
  return (
    <Modal open={!!tx} onClose={onClose} title="Transaction details">
      {tx && (
        <div className="space-y-3 text-sm">
          <div className="flex justify-between"><span className="text-slate-500">Description</span><span className="font-medium text-slate-900">{tx.description}</span></div>
          <div className="flex justify-between"><span className="text-slate-500">Amount</span><span className={cx("f-mono font-semibold", tx.amount > 0 ? "text-emerald-600" : "text-slate-900")}>{tx.amount > 0 ? "+" : ""}{fmt(tx.amount)}</span></div>
          <div className="flex justify-between"><span className="text-slate-500">Category</span><span className="font-medium text-slate-900">{tx.category}</span></div>
          <div className="flex justify-between"><span className="text-slate-500">Date</span><span className="font-medium text-slate-900">{fmtDate(tx.date)}</span></div>
          <div className="flex justify-between"><span className="text-slate-500">Status</span><Badge tone={tx.status === "Posted" ? "green" : "amber"}>{tx.status}</Badge></div>
          <div className="flex justify-between"><span className="text-slate-500">Reference</span><span className="f-mono text-xs text-slate-500">{tx.id}</span></div>
        </div>
      )}
    </Modal>
  );
}

function Transactions({ session }) {
  const [q, setQ] = useState("");
  const [acc, setAcc] = useState("all");
  const [type, setType] = useState("all");
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [detail, setDetail] = useState(null);

  const filtered = session.transactions.filter((t) => {
    if (q && !t.description.toLowerCase().includes(q.toLowerCase()) && !t.category.toLowerCase().includes(q.toLowerCase())) return false;
    if (acc !== "all" && t.accountId !== acc) return false;
    if (type === "credit" && t.amount < 0) return false;
    if (type === "debit" && t.amount > 0) return false;
    if (from && new Date(t.date) < new Date(from)) return false;
    if (to && new Date(t.date) > new Date(to)) return false;
    return true;
  });

  return (
    <div className="space-y-5">
      <h1 className="f-display text-2xl font-bold text-slate-900">Transactions</h1>
      <div className="grid gap-3 rounded-2xl border border-slate-200 bg-white p-4 sm:grid-cols-2 lg:grid-cols-5">
        <div className="relative lg:col-span-2">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search description or category" className="w-full rounded-lg border border-slate-300 py-2 pl-9 pr-3 text-sm" />
        </div>
        <Select value={acc} onChange={(e) => setAcc(e.target.value)}>
          <option value="all">All accounts</option>
          {session.accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
        </Select>
        <Select value={type} onChange={(e) => setType(e.target.value)}>
          <option value="all">All types</option><option value="credit">Money in</option><option value="debit">Money out</option>
        </Select>
        <div className="flex gap-2">
          <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} className="w-1/2 rounded-lg border border-slate-300 px-2 py-2 text-xs" />
          <input type="date" value={to} onChange={(e) => setTo(e.target.value)} className="w-1/2 rounded-lg border border-slate-300 px-2 py-2 text-xs" />
        </div>
      </div>

      <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white">
        {filtered.length === 0 ? (
          <p className="p-8 text-center text-sm text-slate-400">No transactions match your filters.</p>
        ) : (
          <div className="divide-y divide-slate-100">
            {filtered.map((t) => (
              <button key={t.id} onClick={() => setDetail(t)} className="flex w-full items-center justify-between px-5 py-3 text-left hover:bg-slate-50">
                <div className="flex items-center gap-3">
                  <div className={cx("flex h-9 w-9 items-center justify-center rounded-full", t.amount > 0 ? "bg-emerald-50 text-emerald-600" : "bg-slate-100 text-slate-500")}>
                    {t.amount > 0 ? <ArrowDownLeft size={15} /> : <ArrowUpRight size={15} />}
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-800">{t.description}</p>
                    <p className="text-xs text-slate-400">{fmtDate(t.date)} · {t.category} · <span className={t.status === "Pending" ? "text-amber-600" : ""}>{t.status}</span></p>

                </div>
                <p className={cx("f-mono text-sm font-semibold", t.amount > 0 ? "text-emerald-600" : "text-slate-800")}>{t.amount > 0 ? "+" : ""}{fmt(t.amount)}</p>

function Transfers({ session, setSession, pushToast }) {

function SendMoney({ session, setSession, pushToast }) {
  const [fromId, setFromId] = useState(session.accounts[0]?.id);
  const [recipientMode, setRecipientMode] = useState("beneficiary");
  const [benId, setBenId] = useState(session.beneficiaries[0]?.id || "");
  const [newName, setNewName] = useState("");
  const [newBank, setNewBank] = useState("");
  const [newAcc, setNewAcc] = useState("");
  const [amount, setAmount] = useState("");
  const [note, setNote] = useState("");
  const [errors, setErrors] = useState({});
  const [stage, setStage] = useState("form");
  const [ref, setRef] = useState("");

  const fromAccount = session.accounts.find((a) => a.id === fromId);
  const isInternal = recipientMode === "beneficiary" && session.beneficiaries.find((b) => b.id === benId)?.type === "Internal";
  const fee = recipientMode === "new" || (recipientMode === "beneficiary" && !isInternal) ? 2.5 : 0;

  function review(e) {
    e.preventDefault();
    const errs = {};
    const amt = parseFloat(amount);
    if (!amt || amt <= 0) errs.amount = "Enter a valid amount.";
    else if (fromAccount && amt + fee > fromAccount.available) errs.amount = "Amount exceeds available balance.";
    if (recipientMode === "beneficiary" && !benId) errs.recipient = "Select a beneficiary.";
    if (recipientMode === "new") {
      if (!newName.trim()) errs.newName = "Required.";
      if (!newBank.trim()) errs.newBank = "Required.";
      if (!/^[0-9]{6,18}$/.test(newAcc)) errs.newAcc = "Enter a valid account number.";
    }
    setErrors(errs);
    if (Object.keys(errs).length) return;
    setStage("review");
  }

  function confirm() {
    const amt = parseFloat(amount);
    const recipientName = recipientMode === "new" ? newName : session.beneficiaries.find((b) => b.id === benId)?.name;
    const rn = refNumber();
    setRef(rn);
    setSession((s) => {
      const accounts = s.accounts.map((a) => a.id === fromId ? { ...a, available: +(a.available - amt - fee).toFixed(2), current: +(a.current - amt - fee).toFixed(2) } : a);
      const txns = [{ id: uid("txn"), accountId: fromId, date: new Date().toISOString(), description: `Transfer to ${recipientName}`, category: "Transfer", amount: -amt, status: "Posted" }, ...s.transactions];
      let beneficiaries = s.beneficiaries;
      if (recipientMode === "new") {
        beneficiaries = [...s.beneficiaries, { id: uid("ben"), name: newName, nickname: newName, bank: newBank, accountNumber: newAcc, type: "External" }];
      }
      const notifications = [{ id: uid("ntf"), title: "Payment sent", body: `You sent ${fmt(amt)} to ${recipientName}.`, time: "Just now", read: false, type: "transfer" }, ...s.notifications];
      return { ...s, accounts, transactions: txns, beneficiaries, notifications };
    });
    setStage("done");
    pushToast(`${fmt(amt)} sent to ${recipientName}.`);
  }

  function resetForm() {
    setAmount(""); setNote(""); setStage("form"); setNewName(""); setNewBank(""); setNewAcc("");
  }

  if (stage === "done") {
    return (
      <div className="max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center">
        <div className="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-emerald-100 text-emerald-600"><CheckCircle2 size={26} /></div>
        <h3 className="f-display text-xl font-bold text-slate-900">Transfer complete</h3>
        <p className="mt-2 text-sm text-slate-500">Reference <span className="f-mono">{ref}</span></p>
        <Btn className="mt-6 w-full" onClick={resetForm}>Make another transfer</Btn>
      </div>
    );
  }

  if (stage === "review") {
    const amt = parseFloat(amount);
    const recipientName = recipientMode === "new" ? newName : session.beneficiaries.find((b) => b.id === benId)?.name;
    return (
      <div className="max-w-md rounded-2xl border border-slate-200 bg-white p-6">
        <h3 className="f-display mb-4 text-lg font-semibold text-slate-900">Review transfer</h3>
        <div className="space-y-3 text-sm">
          <div className="flex justify-between"><span className="text-slate-500">From</span><span className="font-medium">{fromAccount?.name}</span></div>
          <div className="flex justify-between"><span className="text-slate-500">To</span><span className="font-medium">{recipientName}</span></div>
          <div className="flex justify-between"><span className="text-slate-500">Amount</span><span className="f-mono font-medium">{fmt(amt)}</span></div>
          <div className="flex justify-between"><span className="text-slate-500">Fee</span><span className="f-mono font-medium">{fee ? fmt(fee) : "Free"}</span></div>
          <div className="flex justify-between border-t border-slate-100 pt-3"><span className="font-semibold text-slate-800">Total</span><span className="f-mono font-semibold">{fmt(amt + fee)}</span></div>
        </div>
        <div className="mt-6 flex gap-3">
          <Btn variant="outline" className="flex-1" onClick={() => setStage("form")}>Edit</Btn>
          <Btn className="flex-1" onClick={confirm}>Confirm &amp; send</Btn>
        </div>
      </div>
    );
  }

  return (
    <form onSubmit={review} className="max-w-md space-y-4 rounded-2xl border border-slate-200 bg-white p-6">
      <Field label="From account" required>
        <Select value={fromId} onChange={(e) => setFromId(e.target.value)}>
          {session.accounts.filter((a) => a.type !== "Credit").map((a) => <option key={a.id} value={a.id}>{a.name} — {fmt(a.available)}</option>)}
        </Select>
      </Field>
      <Field label="Recipient" required error={errors.recipient}>
        <div className="mb-2 flex gap-2 text-xs font-semibold">
          <button type="button" onClick={() => setRecipientMode("beneficiary")} className={cx("rounded-full px-3 py-1", recipientMode === "beneficiary" ? "bg-teal-600 text-white" : "bg-slate-100 text-slate-600")}>Saved beneficiary</button>
          <button type="button" onClick={() => setRecipientMode("new")} className={cx("rounded-full px-3 py-1", recipientMode === "new" ? "bg-teal-600 text-white" : "bg-slate-100 text-slate-600")}>New recipient</button>
        </div>
        {recipientMode === "beneficiary" ? (
          session.beneficiaries.length ? (
            <Select value={benId} onChange={(e) => setBenId(e.target.value)} error={errors.recipient}>
              {session.beneficiaries.map((b) => <option key={b.id} value={b.id}>{b.nickname} — {b.bank}</option>)}
            </Select>
          ) : <p className="text-xs text-slate-400">No saved beneficiaries yet — add one from the Beneficiaries tab, or send to a new recipient.</p>
        ) : (
          <div className="space-y-3">
            <TextInput placeholder="Recipient name" value={newName} onChange={(e) => setNewName(e.target.value)} error={errors.newName} />
            {errors.newName && <p className="text-xs font-medium text-rose-600">{errors.newName}</p>}
            <TextInput placeholder="Recipient bank" value={newBank} onChange={(e) => setNewBank(e.target.value)} error={errors.newBank} />
            {errors.newBank && <p className="text-xs font-medium text-rose-600">{errors.newBank}</p>}
            <TextInput placeholder="Account number" value={newAcc} onChange={(e) => setNewAcc(e.target.value)} error={errors.newAcc} />
            {errors.newAcc && <p className="text-xs font-medium text-rose-600">{errors.newAcc}</p>}
          </div>
        )}
      </Field>
      <Field label="Amount" required error={errors.amount}>
        <TextInput type="number" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} error={errors.amount} placeholder="0.00" />
      </Field>
      <Field label="Note (optional)"><TextInput value={note} onChange={(e) => setNote(e.target.value)} placeholder="What's this for?" /></Field>
      <Btn type="submit" className="w-full">Review transfer</Btn>
    </form>
  );
}

function PayBill({ session, setSession, pushToast }) {
  const [billerId, setBillerId] = useState(BILLERS[0].id);
  const [fromId, setFromId] = useState(session.accounts[0]?.id);
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [errors, setErrors] = useState({});
  const [success, setSuccess] = useState(null);

  function submit(e) {
    e.preventDefault();
    const errs = {};
    const amt = parseFloat(amount);
    const fromAccount = session.accounts.find((a) => a.id === fromId);
    if (!amt || amt <= 0) errs.amount = "Enter a valid amount.";
    else if (fromAccount && amt > fromAccount.available) errs.amount = "Amount exceeds available balance.";
    setErrors(errs);
    if (Object.keys(errs).length) return;
    const biller = BILLERS.find((b) => b.id === billerId);
    setSession((s) => ({
      ...s,
      accounts: s.accounts.map((a) => a.id === fromId ? { ...a, available: +(a.available - amt).toFixed(2), current: +(a.current - amt).toFixed(2) } : a),
      transactions: [{ id: uid("txn"), accountId: fromId, date: new Date().toISOString(), description: biller.name, category: "Utilities", amount: -amt, status: "Pending" }, ...s.transactions],
    }));
    setSuccess({ biller: biller.name, amt });
    pushToast(`${fmt(amt)} scheduled to ${biller.name}.`);
    setAmount("");
  }

  return (
    <form onSubmit={submit} className="max-w-md space-y-4 rounded-2xl border border-slate-200 bg-white p-6">
      <Field label="Biller" required>
        <div className="grid grid-cols-2 gap-2">
          {BILLERS.map((b) => (
            <button type="button" key={b.id} onClick={() => setBillerId(b.id)} className={cx("flex items-center gap-2 rounded-xl border p-3 text-left text-sm font-medium", billerId === b.id ? "border-teal-600 bg-teal-50 text-teal-800" : "border-slate-200 text-slate-600")}>
              <b.icon size={16} /> {b.name}
            </button>
          ))}
        </div>
      </Field>
      <Field label="Pay from" required>
        <Select value={fromId} onChange={(e) => setFromId(e.target.value)}>
          {session.accounts.filter((a) => a.type !== "Credit").map((a) => <option key={a.id} value={a.id}>{a.name} — {fmt(a.available)}</option>)}
        </Select>
      </Field>
      <Field label="Amount" required error={errors.amount}><TextInput type="number" step="0.01" value={amount} onChange={(e) => setAmount(e.target.value)} error={errors.amount} /></Field>
      <Field label="Payment date"><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
      <Btn type="submit" className="w-full">Pay bill</Btn>
      {success && <p className="flex items-center gap-1.5 text-sm font-medium text-emerald-600"><CheckCircle2 size={15} /> {fmt(success.amt)} scheduled to {success.biller}.</p>}
    </form>
  );
}

function Beneficiaries({ session, setSession, pushToast }) {
  const [modal, setModal] = useState(false);
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ name: "", nickname: "", bank: "", accountNumber: "", type: "External" });
  const [errors, setErrors] = useState({});

  function openNew() { setEditing(null); setForm({ name: "", nickname: "", bank: "", accountNumber: "", type: "External" }); setModal(true); }
  function openEdit(b) { setEditing(b.id); setForm(b); setModal(true); }

  function save(e) {
    e.preventDefault();
    const errs = {};
    if (!form.name.trim()) errs.name = "Required.";
    if (!form.bank.trim()) errs.bank = "Required.";
    if (!/^[0-9]{6,18}$/.test(form.accountNumber)) errs.accountNumber = "Enter a valid account number.";
    setErrors(errs);
    if (Object.keys(errs).length) return;
    setSession((s) => {
      if (editing) return { ...s, beneficiaries: s.beneficiaries.map((b) => b.id === editing ? { ...form, id: editing, nickname: form.nickname || form.name } : b) };
      return { ...s, beneficiaries: [...s.beneficiaries, { ...form, id: uid("ben"), nickname: form.nickname || form.name }] };
    });
    pushToast(editing ? "Beneficiary updated." : "Beneficiary added.");
    setModal(false);
  }

  function remove(id) {
    setSession((s) => ({ ...s, beneficiaries: s.beneficiaries.filter((b) => b.id !== id) }));
    pushToast("Beneficiary removed.");
  }

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between">
        <h1 className="f-display text-2xl font-bold text-slate-900">Beneficiaries</h1>
        <Btn icon={Plus} onClick={openNew}>Add beneficiary</Btn>
      </div>
      {session.beneficiaries.length === 0 ? (
        <div className="rounded-2xl border border-dashed border-slate-300 p-10 text-center text-sm text-slate-400">No beneficiaries yet. Add one to start sending money.</div>
      ) : (
        <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          {session.beneficiaries.map((b) => (
            <div key={b.id} className="rounded-2xl border border-slate-200 bg-white p-5">
              <div className="flex items-start justify-between">
                <div className="flex h-10 w-10 items-center justify-center rounded-full bg-slate-900 text-sm font-bold text-white">{b.name.split(" ").map((n) => n[0]).slice(0, 2).join("")}</div>
                <Badge tone={b.type === "Internal" ? "teal" : "slate"}>{b.type}</Badge>
              </div>
              <p className="mt-3 font-semibold text-slate-900">{b.nickname}</p>
              <p className="text-sm text-slate-500">{b.name}</p>
              <p className="text-xs text-slate-400">{b.bank} · •••{b.accountNumber.slice(-4)}</p>
              <div className="mt-4 flex gap-2">
                <Btn size="sm" variant="outline" icon={Edit2} onClick={() => openEdit(b)}>Edit</Btn>
                <Btn size="sm" variant="ghost" icon={Trash2} onClick={() => remove(b.id)}>Remove</Btn>
              </div>
            </div>
          ))}
        </div>
      )}
      <Modal open={modal} onClose={() => setModal(false)} title={editing ? "Edit beneficiary" : "Add beneficiary"}>
        <form onSubmit={save} className="space-y-4">
          <Field label="Full name" required error={errors.name}><TextInput value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} error={errors.name} /></Field>
          <Field label="Nickname"><TextInput value={form.nickname} onChange={(e) => setForm({ ...form, nickname: e.target.value })} placeholder="Optional" /></Field>
          <Field label="Bank name" required error={errors.bank}><TextInput value={form.bank} onChange={(e) => setForm({ ...form, bank: e.target.value })} error={errors.bank} /></Field>
          <Field label="Account number" required error={errors.accountNumber}><TextInput value={form.accountNumber} onChange={(e) => setForm({ ...form, accountNumber: e.target.value })} error={errors.accountNumber} /></Field>
          <Field label="Type">
            <Select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
              <option>Internal</option><option>External</option>
            </Select>
          </Field>
          <Btn type="submit" className="w-full">{editing ? "Save changes" : "Add beneficiary"}</Btn>
        </form>
      </Modal>
    </div>
  );
}

function CardsTab({ session, setSession, pushToast }) {
  const [reveal, setReveal] = useState(null);
  const [pwModal, setPwModal] = useState(null);
  const [pwInput, setPwInput] = useState("");
  const [limitModal, setLimitModal] = useState(null);
  const [confirmModal, setConfirmModal] = useState(null);

  function toggleFreeze(id) {
    setSession((s) => ({ ...s, cards: s.cards.map((c) => c.id === id ? { ...c, status: c.status === "Frozen" ? "Active" : "Frozen" } : c) }));
    const card = session.cards.find((c) => c.id === id);
    pushToast(card.status === "Frozen" ? "Card unfrozen." : "Card frozen — no new transactions will be approved.");
  }
  function requestReplacement(id) {
    setSession((s) => ({ ...s, cards: s.cards.map((c) => c.id === id ? { ...c, status: "Replacement requested" } : c) }));
    pushToast("Replacement card requested — arrives in 5–7 business days (demo).");
    setConfirmModal(null);
  }
  function reportLost(id) {
    setSession((s) => ({ ...s, cards: s.cards.map((c) => c.id === id ? { ...c, status: "Blocked · replacement ordered" } : c) }));
    pushToast("Card reported lost and blocked. A replacement is on its way.");
    setConfirmModal(null);
  }
  function saveLimit(id, limit) {
    setSession((s) => ({ ...s, cards: s.cards.map((c) => c.id === id ? { ...c, limit } : c) }));
    pushToast("Spending limit updated.");
    setLimitModal(null);
  }
  function tryReveal() {
    if (pwInput.length < 3) { pushToast("Enter your password to continue.", "error"); return; }
    setReveal(pwModal);
    setPwModal(null);
    setPwInput("");
    setTimeout(() => setReveal(null), 10000);
  }

  return (
    <div className="space-y-5">
      <h1 className="f-display text-2xl font-bold text-slate-900">Cards</h1>
      <div className="grid gap-6 md:grid-cols-2">
        {session.cards.map((c) => (
          <div key={c.id} className="rounded-2xl border border-slate-200 bg-white p-5">
            <div className={cx("mb-4 aspect-[1.6/1] rounded-xl p-5 text-white shadow-inner bg-gradient-to-br", c.kind === "Debit" ? "from-slate-800 to-slate-950" : "from-teal-700 to-teal-950")}>
              <div className="flex items-center justify-between">
                <span className="text-xs font-semibold uppercase tracking-wide text-white/80">Veltra {c.kind}</span>
                <Landmark size={16} />
              </div>
              <p className="f-mono mt-8 text-lg tracking-widest text-white/90">
                {reveal === c.id ? c.full : `•••• •••• •••• ${c.last4}`}
              </p>
              <div className="mt-3 flex justify-between text-xs text-white/70">
                <span>Exp {c.expiry}</span>
                <span>CVV {reveal === c.id ? c.cvv : "•••"}</span>
              </div>
            </div>
            <div className="flex items-center justify-between">
              <p className="font-semibold text-slate-900">{c.name}</p>
              <Badge tone={c.status === "Active" ? "green" : c.status.includes("Block") ? "rose" : "amber"}>{c.status}</Badge>
            </div>
            <p className="text-xs text-slate-500 mt-1">Spending limit: {fmt(c.limit)}</p>
            <div className="mt-4 flex flex-wrap gap-2">
              <Btn size="sm" variant={c.status === "Frozen" ? "primary" : "outline"} icon={Snowflake} onClick={() => toggleFreeze(c.id)}>{c.status === "Frozen" ? "Unfreeze" : "Freeze"}</Btn>
              <Btn size="sm" variant="outline" icon={Eye} onClick={() => setPwModal(c.id)}>Show details</Btn>
              <Btn size="sm" variant="outline" icon={Settings} onClick={() => setLimitModal(c)}>Set limit</Btn>
              <Btn size="sm" variant="ghost" icon={RefreshCw} onClick={() => setConfirmModal({ id: c.id, action: "replace" })}>Replace</Btn>
              <Btn size="sm" variant="ghost" className="text-rose-600" icon={ShieldAlert} onClick={() => setConfirmModal({ id: c.id, action: "lost" })}>Report lost</Btn>
            </div>
          </div>
        ))}
      </div>

      <Modal open={!!pwModal} onClose={() => setPwModal(null)} title="Confirm your password">
        <p className="mb-3 text-sm text-slate-500">For your security, re-enter your password to view full card details.</p>
        <TextInput type="password" value={pwInput} onChange={(e) => setPwInput(e.target.value)} placeholder="Password" />
        <Btn className="mt-4 w-full" onClick={tryReveal}>Confirm</Btn>
      </Modal>

      <Modal open={!!limitModal} onClose={() => setLimitModal(null)} title="Set spending limit">
        {limitModal && <LimitEditor card={limitModal} onSave={saveLimit} />}
      </Modal>

      <Modal open={!!confirmModal} onClose={() => setConfirmModal(null)} title={confirmModal?.action === "lost" ? "Report card lost or stolen" : "Request replacement card"}>
        <p className="mb-4 text-sm text-slate-600">
          {confirmModal?.action === "lost" ? "This will immediately block the card from further use and order a free replacement." : "A new physical card will be mailed to your address on file within 5–7 business days."}
        </p>
        <div className="flex gap-3">
          <Btn variant="outline" className="flex-1" onClick={() => setConfirmModal(null)}>Cancel</Btn>
          <Btn variant="danger" className="flex-1" onClick={() => confirmModal?.action === "lost" ? reportLost(confirmModal.id) : requestReplacement(confirmModal.id)}>Confirm</Btn>
        </div>
      </Modal>
    </div>
  );
}

function LimitEditor({ card, onSave }) {

  return (
    <div className="space-y-4">
      <p className="f-mono text-2xl font-semibold text-slate-900">{fmt(val)}</p>
      <input type="range" min="100" max="10000" step="100" value={val} onChange={(e) => setVal(+e.target.value)} className="w-full accent-teal-600" />
      <Btn className="w-full" onClick={() => onSave(card.id, val)}>Save limit</Btn>
    </div>
  );
}

function Statements({ session }) {
  const [view, setView] = useState(null);
  const [accFilter, setAccFilter] = useState("all");
  const filtered = accFilter === "all" ? session.statements : session.statements.filter((s) => s.account === accFilter);
  const accNames = [...new Set(session.statements.map((s) => s.account))];

  function statementText(st) {
    const txns = session.transactions.filter((t) => {
      const acc = session.accounts.find((a) => a.id === t.accountId);
      return acc?.name === st.account;
    }).slice(0, 12);
    let body = `Veltra Bank (demo) — Statement\nAccount: ${st.account}\nPeriod: ${st.period}\n\nTransactions:\n`;
    if (!txns.length) body += "No transactions recorded for this period in the demo dataset.\n";
    txns.forEach((t) => { body += `${fmtDate(t.date)}  ${t.description.padEnd(30)}  ${t.amount > 0 ? "+" : ""}${fmt(t.amount)}\n`; });
    return body;
  }

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <h1 className="f-display text-2xl font-bold text-slate-900">Statements</h1>

        <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white">

            {filtered.map((s) => (
              <div key={s.id} className="flex items-center justify-between px-5 py-3">

                    <p className="text-xs text-slate-400">{s.period}</p>
