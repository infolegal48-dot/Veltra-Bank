      </Modal>
    </div>
  );
}

function ProfileTab({ profile, pushToast, session }) {
  const [form, setForm] = useState({ phone: profile.phone || "", address: profile.address || "", occupation: profile.occupation || "" });
  const [errors, setErrors] = useState({});

  function save(e) {
    e.preventDefault();
    const errs = {};
    if (!phoneRe.test(form.phone)) errs.phone = "Enter a valid phone number.";
    setErrors(errs);
    if (Object.keys(errs).length) return;
    pushToast("Profile updated.");
  }

  function downloadData() {
    download("veltra-account-data.json", JSON.stringify({ profile: { ...profile, password: undefined }, accounts: session.accounts, beneficiaries: session.beneficiaries }, null, 2));
  }

  return (
    <div className="max-w-2xl space-y-6">
      <h1 className="f-display text-2xl font-bold text-slate-900">Profile</h1>
      <div className="flex items-center gap-4 rounded-2xl border border-slate-200 bg-white p-5">
        <div className="flex h-14 w-14 items-center justify-center rounded-full bg-slate-900 text-lg font-bold text-white">{profile.firstName?.[0]}{profile.lastName?.[0]}</div>
        <div>
          <p className="font-semibold text-slate-900">{profile.firstName} {profile.lastName}</p>
          <p className="text-sm text-slate-500">{profile.email}</p>
          <Badge tone="green">KYC verified</Badge>
        </div>
      </div>
      <form onSubmit={save} className="space-y-4 rounded-2xl border border-slate-200 bg-white p-5">
        <Field label="Phone number" required error={errors.phone}><TextInput value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} error={errors.phone} /></Field>
        <Field label="Residential address"><TextInput value={form.address} onChange={(e) => setForm({ ...form, address: e.target.value })} /></Field>
        <Field label="Occupation"><TextInput value={form.occupation} onChange={(e) => setForm({ ...form, occupation: e.target.value })} /></Field>
        <Btn type="submit">Save changes</Btn>
      </form>
      <div className="rounded-2xl border border-slate-200 bg-white p-5">
        <p className="font-semibold text-slate-900">Your data</p>
        <p className="mt-1 text-sm text-slate-500">Download a copy of your account information at any time.</p>
        <Btn variant="outline" className="mt-3" icon={Download} onClick={downloadData}>Download my data</Btn>
      </div>
    </div>
  );
}

function SecurityTab({ session, setSession, pushToast, updateUserPassword }) {
  const [cur, setCur] = useState(""); const [pw1, setPw1] = useState(""); const [pw2, setPw2] = useState("");
  const [errors, setErrors] = useState({});
  const [mfaSetup, setMfaSetup] = useState(false);
  const [mfaCode, setMfaCode] = useState("");

  function changePassword(e) {
    e.preventDefault();
    const errs = {};
    const ok = updateUserPassword.check(cur);
    if (!ok) errs.cur = "Current password is incorrect.";
    if (passwordScore(pw1) < 3) errs.pw1 = "Choose a stronger password.";
    if (pw1 !== pw2) errs.pw2 = "Passwords do not match.";
    setErrors(errs);
    if (Object.keys(errs).length) return;
    updateUserPassword.set(pw1);
    pushToast("Password changed successfully.");
    setCur(""); setPw1(""); setPw2("");
    setSession((s) => ({ ...s, security: { ...s.security, auditLog: [{ id: uid("log"), event: "Password changed", detail: "Self-service", time: "Just now" }, ...s.security.auditLog] } }));
  }

  function toggleMfa() {
    if (session.security.mfaEnabled) {
      setSession((s) => ({ ...s, security: { ...s.security, mfaEnabled: false } }));
      pushToast("Two-factor authentication turned off.");
    } else {
      setMfaSetup(true);
    }
  }
  function confirmMfa() {
    if (mfaCode !== "123456") { pushToast("Incorrect code — use 123456 in this demo.", "error"); return; }
    setSession((s) => ({ ...s, security: { ...s.security, mfaEnabled: true, auditLog: [{ id: uid("log"), event: "Two-factor authentication enabled", detail: "Authenticator app", time: "Just now" }, ...s.security.auditLog] } }));
    setMfaSetup(false); setMfaCode("");
    pushToast("Two-factor authentication enabled.");
  }
  function revoke(id) {
    setSession((s) => ({ ...s, security: { ...s.security, sessions: s.security.sessions.filter((x) => x.id !== id) } }));
    pushToast("Session signed out.");
  }

  return (
    <div className="max-w-2xl space-y-6">
      <h1 className="f-display text-2xl font-bold text-slate-900">Security</h1>

      <form onSubmit={changePassword} className="space-y-4 rounded-2xl border border-slate-200 bg-white p-5">
        <p className="flex items-center gap-2 font-semibold text-slate-900"><KeyRound size={16} className="text-teal-600" /> Change password</p>
        <Field label="Current password" required error={errors.cur}><TextInput type="password" value={cur} onChange={(e) => setCur(e.target.value)} error={errors.cur} /></Field>
        <Field label="New password" required error={errors.pw1}><TextInput type="password" value={pw1} onChange={(e) => setPw1(e.target.value)} error={errors.pw1} /></Field>
        {pw1 && (() => { const s = passwordScore(pw1); const l = passwordLabel(s); return <p className={cx("text-xs font-semibold", l.text)}>{l.label}</p>; })()}
        <Field label="Confirm new password" required error={errors.pw2}><TextInput type="password" value={pw2} onChange={(e) => setPw2(e.target.value)} error={errors.pw2} /></Field>
        <Btn type="submit">Update password</Btn>
      </form>

      <div className="rounded-2xl border border-slate-200 bg-white p-5">
        <div className="flex items-center justify-between">
          <div>
            <p className="flex items-center gap-2 font-semibold text-slate-900"><Smartphone size={16} className="text-teal-600" /> Two-factor authentication</p>
            <p className="mt-1 text-sm text-slate-500">Require a one-time code on every sign-in.</p>
          </div>
          <button onClick={toggleMfa} className={cx("h-7 w-12 rounded-full transition-colors", session.security.mfaEnabled ? "bg-teal-600" : "bg-slate-300")}>
            <span className={cx("block h-5 w-5 translate-x-1 rounded-full bg-white transition-transform", session.security.mfaEnabled && "translate-x-6")} />
          </button>
        </div>
        {mfaSetup && (
          <div className="mt-4 rounded-xl bg-slate-50 p-4">
            <div className="mx-auto mb-3 flex h-28 w-28 items-center justify-center rounded-lg border-2 border-dashed border-slate-300 text-xs text-slate-400">QR code</div>
            <p className="mb-2 text-center text-xs text-slate-500">Scan with an authenticator app, then enter the code. Demo code: <span className="f-mono font-semibold">123456</span></p>
            <TextInput value={mfaCode} onChange={(e) => setMfaCode(e.target.value)} placeholder="6-digit code" />
            <Btn className="mt-3 w-full" onClick={confirmMfa}>Confirm &amp; enable</Btn>
          </div>
        )}
      </div>

      <div className="rounded-2xl border border-slate-200 bg-white p-5">
        <p className="mb-3 font-semibold text-slate-900">Active sessions</p>
        <div className="space-y-2">
          {session.security.sessions.map((s) => (
            <div key={s.id} className="flex items-center justify-between rounded-lg border border-slate-100 px-3 py-2 text-sm">
              <div>
                <p className="font-medium text-slate-800">{s.device} {s.current && <Badge tone="teal">This device</Badge>}</p>
                <p className="text-xs text-slate-400">{s.location} · {s.lastActive}</p>
              </div>
              {!s.current && <button onClick={() => revoke(s.id)} className="text-xs font-semibold text-rose-600">Sign out</button>}
            </div>
          ))}
        </div>
      </div>

      <div className="rounded-2xl border border-slate-200 bg-white p-5">
        <p className="mb-3 font-semibold text-slate-900">Login &amp; account activity</p>
        <div className="space-y-2 text-sm">
          {session.security.auditLog.map((l) => (
            <div key={l.id} className="flex justify-between border-b border-slate-50 pb-2 last:border-0">
              <div><p className="font-medium text-slate-700">{l.event}</p><p className="text-xs text-slate-400">{l.detail}</p></div>
              <p className="text-xs text-slate-400">{l.time}</p>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

const DASH_FAQS = [
  { q: "How do I dispute a transaction?", a: "Open Support, choose \"Submit a dispute,\" select the transaction, and describe the issue. We'll create a case reference for tracking." },
  { q: "How long do external transfers take?", a: "In a live system, external transfers typically settle within 1–2 business days. This demo settles them instantly for illustration." },
  { q: "How do I close my account?", a: "Contact support to start account closure. Any remaining balance would be transferred to a linked external account first." },
];

function SupportTab({ session, setSession, pushToast, openChat }) {
  const [form, setForm] = useState({ subject: "Account support", message: "" });
  const [dispute, setDispute] = useState(false);
  const [disputeForm, setDisputeForm] = useState({ txnId: session.transactions[0]?.id || "", reason: "Unrecognized charge", details: "" });

  function submit(e) {
    e.preventDefault();
    if (form.message.trim().length < 5) { pushToast("Add a few details about your request.", "error"); return; }
    setSession((s) => ({ ...s, requests: [{ id: uid("req"), subject: form.subject, status: "Open", time: "Just now" }, ...s.requests] }));
    pushToast("Support request submitted.");
    setForm({ subject: "Account support", message: "" });
  }
  function submitDispute(e) {
    e.preventDefault();
    setSession((s) => ({ ...s, requests: [{ id: uid("req"), subject: `Dispute: ${disputeForm.reason}`, status: "Open", time: "Just now" }, ...s.requests] }));
    pushToast("Dispute submitted — we'll follow up by email.");
    setDispute(false);
  }

  return (
    <div className="max-w-2xl space-y-6">
      <h1 className="f-display text-2xl font-bold text-slate-900">Support</h1>
      <div className="grid gap-3 sm:grid-cols-3">
        <button onClick={openChat} className="rounded-2xl border border-slate-200 bg-white p-4 text-center hover:border-teal-300"><MessageCircle className="mx-auto mb-2 text-teal-600" size={20} /><p className="text-sm font-semibold">Live chat</p></button>
        <div className="rounded-2xl border border-slate-200 bg-white p-4 text-center"><Phone className="mx-auto mb-2 text-teal-600" size={20} /><p className="text-sm font-semibold">1-800-555-0130</p></div>
        <button onClick={() => setDispute(true)} className="rounded-2xl border border-slate-200 bg-white p-4 text-center hover:border-teal-300"><ReceiptText className="mx-auto mb-2 text-teal-600" size={20} /><p className="text-sm font-semibold">Submit a dispute</p></button>
      </div>

      <Accordion items={DASH_FAQS} />

      <form onSubmit={submit} className="space-y-4 rounded-2xl border border-slate-200 bg-white p-5">
        <p className="font-semibold text-slate-900">Contact support</p>
        <Field label="Subject">
          <Select value={form.subject} onChange={(e) => setForm({ ...form, subject: e.target.value })}>
            <option>Account support</option><option>Card issue</option><option>Transfer issue</option><option>Loan question</option>
          </Select>
        </Field>
        <Field label="Message" required>
          <textarea rows={3} className={inputCls()} value={form.message} onChange={(e) => setForm({ ...form, message: e.target.value })} placeholder="Describe your issue" />
        </Field>
        <Btn type="submit">Send request</Btn>
      </form>

      {session.requests.length > 0 && (
        <div className="rounded-2xl border border-slate-200 bg-white p-5">
          <p className="mb-3 font-semibold text-slate-900">Your requests</p>
          <div className="space-y-2 text-sm">
            {session.requests.map((r) => (
              <div key={r.id} className="flex items-center justify-between border-b border-slate-50 pb-2 last:border-0">
                <p className="font-medium text-slate-700">{r.subject}</p>
                <div className="flex items-center gap-2"><Badge tone="amber">{r.status}</Badge><span className="text-xs text-slate-400">{r.time}</span></div>
              </div>
            ))}
          </div>
        </div>
      )}

      <Modal open={dispute} onClose={() => setDispute(false)} title="Submit a dispute">
        <form onSubmit={submitDispute} className="space-y-4">
          <Field label="Transaction">
            <Select value={disputeForm.txnId} onChange={(e) => setDisputeForm({ ...disputeForm, txnId: e.target.value })}>
              {session.transactions.slice(0, 15).map((t) => <option key={t.id} value={t.id}>{t.description} — {fmt(t.amount)}</option>)}
            </Select>
          </Field>
          <Field label="Reason">
            <Select value={disputeForm.reason} onChange={(e) => setDisputeForm({ ...disputeForm, reason: e.target.value })}>
              <option>Unrecognized charge</option><option>Incorrect amount</option><option>Duplicate charge</option><option>Service not received</option>
            </Select>
          </Field>
          <Field label="Details"><textarea rows={3} className={inputCls()} value={disputeForm.details} onChange={(e) => setDisputeForm({ ...disputeForm, details: e.target.value })} /></Field>
          <Btn type="submit" className="w-full">Submit dispute</Btn>
        </form>
      </Modal>
    </div>
  );
}

/* ============================== APP ROOT ============================== */
function App() {
  const [page, setPage] = useState("home");
  const [users, setUsers] = useState([
    { id: "demo", email: DEMO_EMAIL, password: DEMO_PASSWORD, firstName: "Jordan", lastName: "Blake", phone: "+233 20 555 0110", address: "12 Ledger Street, Accra, GH", occupation: "Employed", accountType: "Everyday Checking", mfaEnabled: true, isDemo: true },
    { id: "kingsley", email: "kingsley43@gmail.com", password: "Kyeremeh43", firstName: "Kyeremeh", lastName: "Kingsley", phone: "+233 24 555 0199", address: "8 Harbor Close, Accra, GH", occupation: "Employed", accountType: "Growth Savings", mfaEnabled: false, isDemo: false, dataset: "kingsley" },
  ]);
  const [authProfile, setAuthProfile] = useState(null);
  const [session, setSession] = useState(null);
  const [pendingIntent, setPendingIntent] = useState(null);
  const [loginPrefill, setLoginPrefill] = useState("");
  const [toasts, setToasts] = useState([]);
  const [chatOpen, setChatOpen] = useState(false);

  function pushToast(msg, type = "success") {
    const id = uid("toast");
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3500);
  }

  function goto(p, intent, prefill) {
    if (intent) setPendingIntent(intent);
    if (prefill) setLoginPrefill(prefill);
    setPage(p);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function scrollTo(hash) {
    if (page !== "home") { setPage("home"); setTimeout(() => document.querySelector(hash)?.scrollIntoView({ behavior: "smooth" }), 50); }
    else document.querySelector(hash)?.scrollIntoView({ behavior: "smooth" });
  }

  function onLoginSuccess(user) {
    setAuthProfile(user);
    setSession(user.isDemo ? buildDemoData() : user.dataset === "kingsley" ? buildKingsleyData() : buildStarterData(user));
    setPage("dashboard");
    pushToast(`Welcome back, ${user.firstName}.`);
  }

  function onLogout() {
    setAuthProfile(null);
    setSession(null);
    setPage("home");
    pushToast("You've been signed out securely.");
  }

  const updateUserPassword = {
    check: (pw) => authProfile && pw === (users.find((u) => u.id === authProfile.id)?.password),
    set: (pw) => setUsers((us) => us.map((u) => u.id === authProfile.id ? { ...u, password: pw } : u)),
  };

  return (
    <div className="f-body min-h-screen bg-white text-slate-900 antialiased">
      <FontImport />
      {page !== "dashboard" && <DemoBanner />}
      {page !== "dashboard" && <NavBar goto={goto} onNavClick={scrollTo} />}

      {page === "home" && <HomePage goto={goto} pushToast={pushToast} openChat={() => setChatOpen(true)} />}
      {page === "login" && <LoginPage goto={goto} users={users} onSuccess={onLoginSuccess} prefillEmail={loginPrefill} pushToast={pushToast} />}
      {page === "register" && <RegisterPage goto={goto} users={users} setUsers={setUsers} pushToast={pushToast} />}
      {page === "dashboard" && session && (
        <Dashboard
          profile={authProfile}
          session={session}
          setSession={setSession}
          onLogout={onLogout}
          initialTab={pendingIntent === "transfers" ? "transfers" : pendingIntent === "cards" ? "cards" : pendingIntent === "loans" ? "overview" : "overview"}
          pushToast={pushToast}
          openChat={() => setChatOpen(true)}
          updateUserPassword={updateUserPassword}
        />
      )}

      {page !== "dashboard" && <Footer goto={goto} scrollTo={scrollTo} />}
      <SupportChat open={chatOpen} onClose={() => setChatOpen(false)} />
      <ToastHost toasts={toasts} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

</script>
</body>
